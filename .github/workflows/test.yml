name: Test

on:
  push:
  pull_request:

jobs:
  resolve-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Version resolution resolves latest + pinned
        env:
          INPUT_TOKEN: ${{ github.token }}
        run: |
          node -e "require('./main.js').resolveVersion('latest').then(v => { if (!/^\d+\.\d+\.\d+$/.test(v)) throw new Error('bad latest: '+v); console.log('latest ->', v); })"
          node -e "require('./main.js').resolveVersion('v9.9.9').then(v => { if (v !== '9.9.9') throw new Error('bad pin: '+v); console.log('pinned ->', v); })"
          node -e "const m = require('./main.js').describeFailure('u', 403); if (!/github-token/.test(m)) throw new Error(m); console.log(m)"

  install:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          version: 'latest'
          token: ${{ github.token }}
      - run: govard version
