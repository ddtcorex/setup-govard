name: Setup Govard
description: Install the Govard CLI with version pinning via the npm wrapper
inputs:
  version:
    description: Govard version (e.g. 1.70.3) or 'latest'
    default: latest
  token:
    description: Token used for the GitHub release lookup, so 'latest' does not depend on the anonymous API quota. Pass the job's GITHUB_TOKEN.
    required: false
    default: ''
runs:
  using: node24
  main: main.js
branding:
  icon: terminal
  color: blue
